<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join - Dhaka Imperial College IT Club</title>
<style>body{font-family:sans-serif;margin:0;background:#f0f2f5}header{background:linear-gradient(135deg,#003b73,#1683d8);color:white;text-align:center;padding:30px 15px;border-bottom:5px solid #ffc107}form{background:white;padding:25px;border-radius:15px;max-width:400px;margin:20px auto;box-shadow:0 5px 15px rgba(0,0,0,.1)}input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{width:100%;padding:13px;background:#003b73;color:white;border:none;border-radius:8px;font-size:16px}a{color:white}</style>
</head>
<body>
<header><h2>Dhaka Imperial College IT Club</h2><a href="index.html">← Home এ ফিরে যাও</a></header>
<form id="f">
<h3 style="text-align:center">Membership Form</h3>
<input name="name" placeholder="তোমার নাম" required>
<input name="class" placeholder="ক্লাস (যেমন: 9)" required>
<select name="group"><option>Science</option><option>Commerce</option><option>Arts</option></select>
<input name="mobile" placeholder="মোবাইল নাম্বার" required>
<textarea name="reason" placeholder="কেন IT Club এ জয়েন করতে চাও?"></textarea>
<button>Submit</button>
<p id="msg"></p>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e)=>{
e.preventDefault();
document.getElementById('msg').innerText="পাঠানো হচ্ছে...";
let data={}; new FormData(e.target).forEach((v,k)=>data[k]=v);
await fetch("https://script.google.com/macros/s/AKfycbwMHO10lZCAa408scDPtBYmrLWsY9UMvtJU9NSZ4wC3nDiBlXHVoIg629Vs22-8nxo2Ew/exec",{method:"POST",mode:"no-cors",body:JSON.stringify(data)});
document.getElementById('msg').innerText="✅ হয়ে গেছে! তোমার তথ্য Sheet এ চলে গেছে।";
e.target.reset();
});
</script>
</body>
</html>
